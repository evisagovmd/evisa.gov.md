<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Visa Application</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#efefef;
}

/* MAIN CONTAINER */

.page-container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
}

/* TITLE */

h1{
margin-top:0;
border-bottom:1px dashed #aaa;
padding-bottom:10px;
}

/* FORM AREA */

.form-area{
display:flex;
gap:20px;
background:#d9e6e8;
padding:20px;
}

/* LEFT SIDE */

.form-left{
flex:2;
}

/* RIGHT HELP BOX */

.form-right{
flex:1;
background:#cfe0e2;
padding:15px;
font-size:14px;
}

/* FORM ELEMENTS */

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input, select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #999;
box-sizing:border-box;
}

button{
margin-top:20px;
padding:12px 20px;
background:#2f65a7;
color:white;
border:none;
cursor:pointer;
font-size:16px;
width:100%;
max-width:220px;
}

button:hover{
background:#1e4c86;
}

/* MOBILE RESPONSIVE */

@media (max-width:768px){

.form-area{
flex-direction:column;
}

.form-right{
order:2;
}

.form-left{
order:1;
}

button{
max-width:100%;
}

}

</style>

</head>

<body>

<div class="page-container">

<h1>Visa application</h1>

<div class="form-area">

<div class="form-left">

<form>

<label>Surname *</label>
<input type="text" required>

<label>First name *</label>
<input type="text" required>

<label>Nationality *</label>
<select required>
<option>Select</option>
<option>United States</option>
<option>United Kingdom</option>
<option>India</option>
<option>Nepal</option>
<option>Other</option>
</select>

<label>Email *</label>
<input type="email" required>

<label>Email confirmation *</label>
<input type="email" required>

<label>Verification Code</label>
<input type="text">

<button type="submit">Complete the file</button>

</form>

</div>

<div class="form-right">

<b>Help: Surname</b>
<p>Enter the surname (last name) exactly as written in the passport.</p>

<b>Help: First name</b>
<p>Fill in all first names as shown in your passport.</p>

<b>Help: Nationality</b>
<p>Select your citizenship as shown on your travel document.</p>

<b>Help: Email</b>
<p>Your valid email address.</p>

</div>

</div>

</div>

</body>
</html>
