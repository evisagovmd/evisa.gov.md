<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Redirecting...</title>

<style>

body{
font-family:Arial, sans-serif;
background:#efefef;
text-align:center;
padding:60px 20px;
color:#334e68;
}

</style>

</head>

<body>

<p>
Redirecting to the requested page...
</p>

<script src="router.js"></script>

<script>

setTimeout(function(){

const parts =
window.location.pathname
.split("/")
.filter(Boolean);

parts.pop();

const base =
"/" +
(
parts.length
? parts.join("/") + "/"
: ""
);

window.location.replace(
base + "index.html"
);

},1200);

</script>

</body>

</html>
