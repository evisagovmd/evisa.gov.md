<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Continue Application</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#efefef;
}

/* MAIN CONTAINER */

.page-container{
max-width:1000px;
margin:auto;
background:white;
padding:20px;
}

  /* HEADER */

.header img{
width:100%;
height:auto;
display:block;
}

/* NAVIGATION */

/* KEEP HEADER SAME ON MOBILE */

/* NAVBAR */

.navbar{
display:flex;
background:#2f65a7;
}

.nav-item{
flex:1;
text-align:center;
}

.nav-color{
height:6px;
}
.nav-item a{
display:block; 
color:white; 
text-decoration:none; 
padding:12px 0; 
font-size:14px; }
}

.nav-item a:hover{
background:#1e4c86;
}

/* COLORS */

.c1{background:#f6a623;}
.c2{background:#a142f4;}
.c3{background:#34a853;}
.c4{background:#4285f4;}
.c5{background:#ea4335;}
.c6{background:#fbbc05;}
/* TITLE */

h1{
margin-top:0;
border-bottom:1px dashed #aaa;
padding-bottom:10px;
}

/* FORM AREA */

.form-area{
display:flex;
gap:20px;
background:#d9e6e8;
padding:20px;
}

/* LEFT SIDE */

.form-left{
flex:2;
}


/* FORM ELEMENTS */

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input, select{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #999;
box-sizing:border-box;
}

button{
margin-top:20px;
padding:12px 20px;
background:#2f65a7;
color:white;
border:none;
cursor:pointer;
font-size:16px;
width:100%;
max-width:220px;
}

button:hover{
background:#1e4c86;
}

/* MOBILE RESPONSIVE */

@media (max-width:768px){

.form-area{
flex-direction:column;
}

.form-right{
order:2;
}

.form-left{
order:1;
}

button{
max-width:100%;
}

}

</style>

</head>

<body>

<div class="page-container">

<h1>Continue application</h1>

<div class="form-area">

<div class="form-left">

<form>

<label>File Number *</label>
<input type="text" required>

<label>Email *</label>
<input type="email" required>


<label>Verification Code</label>
<input type="text">

<button type="Continue Application">Continue Application</button>


</div>

</div>

</div>

</body>
</html>
