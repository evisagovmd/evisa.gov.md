<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="page-container">

<div class="header">
<img src="header-banner.png" alt="eVisa Portal">
</div>

<div class="navbar">

<div class="nav-item">
<div class="nav-color c1"></div>
<a href="index.html">START</a>
</div>

<div class="nav-item">

<h1 class="page-title">
Check Application Status
</h1>

<p class="intro-text">
Enter the invitation number and passport number exactly as provided.
</p>

<main class="form-area">

<form id="application-form" novalidate>

<div class="form-grid">

<div class="field">

<label for="invitation-number">
Invitation Number *
</label>

<input
type="text"
id="invitation-number"
autocomplete="off"
required>

</div>

<div class="field">

<label for="application-passport">
Passport Number *
</label>

<input
type="text"
id="application-passport"
autocomplete="off"
required>

</div>

</div>

<div class="robot">

<input
type="checkbox"
id="application-robot">

<label for="application-robot">
I'm not a robot
</label>

</div>

<button class="primary-button" type="submit">
Check Status
</button>

</form>

<div
id="application-result"
class="result-shell"
aria-live="polite">
</div>

</main>

<div class="footer">

<div>
Version:
<span data-version>2.0.0</span>
</div>

<div>
E-mail:
<a data-support-email href="mailto:evisa@mfa.gov.md">
evisa@mfa.gov.md
</a>
</div>

</div>

</div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>

</html>
